name: CI - institutional service

on: 
  workflow_dispatch: 
  pull_request:
    branches: ["main", "develop"]

jobs:
  compilar-dotnet:
    name: Compilar ASP.NET Core 10
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # Las pruebas de integración aplican los roles y las migraciones reales.
      - name: Descargar las migraciones de la base
        uses: actions/checkout@v4
        with:
          repository: Arkue-Software/databases
          ref: develop
          path: databases

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar la solucion
        run: dotnet build RedVital.Institucional.sln

      - name: Ejecutar las pruebas
        env:
          REDVITAL_MIGRACIONES_INSTITUCIONAL: ${{ github.workspace }}/databases/institucional
        run: dotnet test RedVital.Institucional.sln --no-build --no-restore
